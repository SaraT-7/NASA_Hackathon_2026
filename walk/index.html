<!doctype html>
<!-- walk/ belongs to work stream C: the screen the astronaut reads while walking. See docs/tasks/C_WALK.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#261d18">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MarsWalk">
  <title>MarsWalk · Wrist display</title>
  <link rel="stylesheet" href="../shared/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="walk.css">
</head>
<body>
  <header>
    <span class="title"><a href="../">MarsWalk</a> · Wrist display</span>
    <span class="tags">
      <span id="badge" class="tag tag-demo"></span>
      <span class="tag tag-sim">SIMULATED POSITION</span>
    </span>
  </header>
  <main>
    <div id="stage" class="stage" aria-label="Map: route, stops and simulated position, turned to the walking direction">
      <div id="speed" class="speed" aria-label="Demo controls: they change the simulation, not the astronaut's data">
        <button id="demo-toggle" class="demo-toggle" type="button" aria-expanded="false" aria-controls="demo-rows">demo</button>
        <div id="demo-rows" class="demo-rows" hidden>
          <div id="speed-row" class="speed-row" role="group" aria-label="Demo control: simulation speed"><span class="speed-label">demo speed</span></div>
          <div id="pace-row" class="speed-row" role="group" aria-label="Demo control: simulated walker's pace compared with the plan"><span class="speed-label">demo pace</span></div>
        </div>
      </div>
      <section id="stop-card" class="stop-card" hidden>
        <div class="stop-top">
          <figure id="stop-photo-wrap" class="stop-photo">
            <img id="stop-photo" alt="">
          </figure>
          <div class="stop-text">
            <h2 class="stop-name"><span id="stop-num" class="stop-num"></span><span id="stop-name"></span></h2>
            <p id="stop-desc" class="stop-desc"></p>
            <p id="stop-credit" class="stop-credit"></p>
          </div>
        </div>
        <div id="stop-check" class="stop-check">
          <p class="check-result"><span id="check-verdict" class="verdict"></span><span id="check-left"></span></p>
          <p id="check-plan" class="check-plan"></p>
        </div>
      </section>
    </div>
    <div id="status" class="status" role="status" data-status="loading">…</div>
    <section class="tile tile-next">
      <h2>Next stop</h2>
      <p id="next-name">…</p>
      <p id="next-dist" class="dist"></p>
    </section>
    <div class="pair">
      <section class="tile"><h2>Elapsed</h2><p id="elapsed">…</p></section>
      <section class="tile"><h2 id="limit-label">Turn back in</h2><p id="limit">…</p><p id="pace-note" class="sub"></p></section>
    </div>
    <section class="tile oxygen" aria-label="Estimated oxygen">
      <div class="oxygen-head"><h2>O₂ <span class="est">· estimated</span></h2><p id="o2-left" class="o2-left">100 %</p></div>
      <div class="battery"><div id="o2-fill" class="battery-fill"></div><div id="o2-home" class="battery-home"></div></div>
      <p id="o2-note" class="o2-note"></p>
    </section>
    <div class="controls">
      <button id="btn-run" class="btn btn-run" type="button">Start</button>
      <button id="btn-done" class="btn btn-done" type="button" disabled>Done here</button>
      <button id="btn-back" class="btn btn-back" type="button" disabled>Turn back</button>
      <section id="return-info" class="tile return-info" hidden>
        <h2 id="return-title">Returning to the habitat</h2>
        <p id="return-note"></p>
      </section>
    </div>
  </main>
  <script src="../shared/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="walk.js"></script>
</body>
</html>
