<!doctype html>
<!-- walk/ belongs to work stream C: the screen the astronaut reads while walking. See docs/tasks/C_WALK.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarsWalk · Walk</title>
  <link rel="stylesheet" href="walk.css">
</head>
<body>
  <header>
    <span class="title"><a href="../">MarsWalk</a> · Walk</span>
    <span class="tags">
      <span id="badge" class="tag tag-demo"></span>
      <span class="tag tag-sim">SIMULATED POSITION</span>
    </span>
  </header>
  <main>
    <div class="stage">
      <div id="speed" class="speed" role="group" aria-label="Demo control: simulation speed">
        <span class="speed-label">demo control</span>
      </div>
    </div>
    <div id="status" class="status" role="status" data-status="loading">…</div>
    <section class="tile tile-next">
      <h2>Next stop</h2>
      <p><span id="next-name">…</span><span id="next-dist" class="dist"></span></p>
    </section>
    <div class="pair">
      <section class="tile"><h2>Elapsed</h2><p id="elapsed">…</p></section>
      <section class="tile"><h2 id="limit-label">Turn back in</h2><p id="limit">…</p></section>
    </div>
    <div class="controls">
      <button id="btn-run" class="btn btn-run" type="button">Start</button>
      <button id="btn-done" class="btn btn-done" type="button" disabled>Done here</button>
      <button id="btn-back" class="btn btn-back" type="button" disabled>Turn back</button>
      <section id="return-info" class="tile return-info" hidden>
        <h2 id="return-title">Returning to the habitat</h2>
        <p id="return-note"></p>
      </section>
    </div>
  </main>
  <script type="module" src="walk.js"></script>
</body>
</html>
